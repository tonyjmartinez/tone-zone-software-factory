# Reusable: generic CI for Node projects that don't have their own. Runs whichever of
# `typecheck`, `check`, `lint`, `test`, `build` exist in package.json. Projects with their own CI keep it.
name: Factory / Node CI

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install, check, test, build
        run: |
          if [ ! -f package.json ]; then echo "::notice::No package.json yet; nothing to check."; exit 0; fi
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          for s in typecheck check lint test build; do npm run "$s" --if-present; done
