# Reusable: generic CI for Node projects that don't have their own. Runs the factory's
# plugin/scripts/verify.sh, the same script Claude and `bin/factory run` use, so "green" means
# the same thing everywhere. Projects with their own CI keep it.
name: Factory / Node CI

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"
      factory_ref:
        type: string
        default: main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Load the factory scripts
        uses: actions/checkout@v6
        with:
          repository: tonyjmartinez/tone-zone-software-factory
          ref: ${{ inputs.factory_ref }}
          path: .factory
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install, typecheck, check, lint, test, build
        run: bash .factory/plugin/scripts/verify.sh .
