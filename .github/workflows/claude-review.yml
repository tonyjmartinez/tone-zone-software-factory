# Reusable (optional): a short automatic review on every PR via /factory:review.
# Off by default in the caller template. Try it locally with `bin/factory review <dir>`.
name: Factory / Review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
      max_turns:
        type: number
        default: 20
      factory_ref:
        type: string
        default: main

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: factory-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Load the factory plugin
        uses: actions/checkout@v6
        with:
          repository: tonyjmartinez/tone-zone-software-factory
          ref: ${{ inputs.factory_ref }}
          path: .factory
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          persist-credentials: false
      - name: Read allowed tools
        id: factory
        run: |
          echo ".factory/" >> .git/info/exclude
          tools=$(sed -n 's/^allowed-tools:[[:space:]]*//p' .factory/plugin/commands/review.md)
          echo "allowed_tools=$tools" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: ${{ github.workspace }}/.factory
          plugins: factory@tone-zone
          prompt: /factory:review ${{ github.event.pull_request.number }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ steps.factory.outputs.allowed_tools }}"
