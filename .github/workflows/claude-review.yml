# Reusable (optional): a cheap, short automatic review on every PR. Off by default in the
# caller template; enable it once the loop is working if you want a second pair of eyes.
name: Factory / Review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
      max_turns:
        type: number
        default: 20

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: factory-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this PR against CLAUDE.md. Report only real problems: bugs, broken behavior on
            mobile or desktop, accessibility regressions, missing tests for new logic. No style nits.
            Use inline comments for specific lines and one short summary comment. If it looks good, say so in one line.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
