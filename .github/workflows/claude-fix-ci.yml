# Reusable: when CI fails on a branch Claude created (claude/*), run /factory:fix-ci on it.
# Capped at `max_attempts` fix commits per branch so a stubborn failure can't loop.
# Test the same command locally with `bin/factory fix-ci <project> <log file>`.
name: Factory / Fix CI

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
      max_turns:
        type: number
        default: 40
      max_attempts:
        type: number
        default: 3
      setup:
        type: string
        default: "if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi"
      node_version:
        type: string
        default: "22"
      factory_ref:
        type: string
        default: main

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: factory-fix-ci-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 50

      - name: Check attempt budget
        id: budget
        env:
          MAX: ${{ inputs.max_attempts }}
        run: |
          # claude/* branches are short-lived, so the last 50 commits cover the whole branch.
          n=$(git log -50 --format=%B | grep -c '\[factory-fix-ci\]' || true)
          echo "attempts=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge "$MAX" ]; then
            echo "::warning::CI fix budget spent ($n/$MAX) on this branch; leaving it for a human."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load the factory plugin
        if: steps.budget.outputs.go == 'true'
        uses: actions/checkout@v6
        with:
          repository: tonyjmartinez/tone-zone-software-factory
          ref: ${{ inputs.factory_ref }}
          path: .factory
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          persist-credentials: false

      - name: Collect failing logs
        id: factory
        if: steps.budget.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo ".factory/" >> .git/info/exclude
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed | tail -n 400 > "$RUNNER_TEMP/ci-failure.log" || true
          wc -l "$RUNNER_TEMP/ci-failure.log"
          tools=$(sed -n 's/^allowed-tools:[[:space:]]*//p' .factory/plugin/commands/fix-ci.md)
          echo "allowed_tools=$tools" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.budget.outputs.go == 'true' && hashFiles('package.json') != ''
        with:
          node-version: ${{ inputs.node_version }}

      - name: Project setup
        if: steps.budget.outputs.go == 'true' && inputs.setup != ''
        run: ${{ inputs.setup }}

      - uses: anthropics/claude-code-action@v1
        if: steps.budget.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: ${{ github.workspace }}/.factory
          plugins: factory@tone-zone
          prompt: /factory:fix-ci ship ${{ runner.temp }}/ci-failure.log
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ steps.factory.outputs.allowed_tools }}"
