# Reusable: Claude implements issues and answers @claude on issues and PRs.
#
#   issue labeled `claude`, or opened with @claude  -> /factory:implement ship #<issue>  (branch, PR)
#   @claude comment on an issue or PR                -> claude-code-action tag mode, with the factory
#                                                       plugin loaded (pushes to the PR branch on PRs)
#
# The agent's instructions and tool permissions live in plugin/commands/*.md of the factory repo,
# the same files `bin/factory run` uses locally, so a local run tests exactly what runs here.
# Only people with write access can trigger it (enforced by claude-code-action).
name: Factory / Claude

on:
  workflow_call:
    inputs:
      model:
        description: "Model alias or ID (sonnet, opus, haiku, or a full claude-* ID)."
        type: string
        default: sonnet
      max_turns:
        description: "Hard cap on agent turns per run; the main cost lever."
        type: number
        default: 80
      setup:
        description: "Shell run before Claude starts so it can build and test (empty to skip)."
        type: string
        default: "if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi"
      node_version:
        type: string
        default: "22"
      factory_ref:
        description: "Branch, tag or SHA of tone-zone-software-factory to load the plugin from."
        type: string
        default: main
      allowed_bots:
        description: "Bot accounts allowed to trigger runs (e.g. claude), for routines that label issues as a bot."
        type: string
        default: ""

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per issue/PR at a time; a newer request waits instead of racing on the same branch.
    concurrency:
      group: factory-claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Load the factory plugin
        uses: actions/checkout@v6
        with:
          repository: tonyjmartinez/tone-zone-software-factory
          ref: ${{ inputs.factory_ref }}
          path: .factory
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          persist-credentials: false

      - name: Keep the plugin out of the project's git
        id: factory
        run: |
          echo ".factory/" >> .git/info/exclude
          tools=$(sed -n 's/^allowed-tools:[[:space:]]*//p' .factory/plugin/commands/implement.md)
          echo "allowed_tools=$tools" >> "$GITHUB_OUTPUT"

      - name: Acknowledge on the issue
        if: github.event_name == 'issues'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "$ISSUE" --body "On it. A PR will link back here when it's ready. [Run log]($RUN_URL)"

      - uses: actions/setup-node@v6
        if: hashFiles('package.json') != ''
        with:
          node-version: ${{ inputs.node_version }}

      - name: Project setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: ${{ inputs.allowed_bots }}
          plugin_marketplaces: ${{ github.workspace }}/.factory
          plugins: factory@tone-zone
          # Issues run the factory command (agent mode); comments use tag mode (empty prompt).
          prompt: "${{ github.event_name == 'issues' && format('/factory:implement ship #{0}', github.event.issue.number) || '' }}"
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ steps.factory.outputs.allowed_tools }}"
            --append-system-prompt "This repo is wired into a software factory. Follow the factory-standards skill and CLAUDE.md."
