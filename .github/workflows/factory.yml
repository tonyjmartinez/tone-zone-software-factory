# The factory runs on itself: label an issue `claude` (or @claude in it) and Claude opens a PR;
# @claude on a PR changes it; red CI on a claude/* branch gets fixed (max 3 tries).
# Same as templates/workflows/factory.yml, but calls this repo's reusable workflows locally and
# loads the plugin from the default branch.
name: Factory

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  claude:
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/claude.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      model: sonnet
      setup: ""
      factory_ref: ${{ github.event.repository.default_branch }}

  fix-ci:
    if: github.event_name == 'workflow_run'
    uses: ./.github/workflows/claude-fix-ci.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      setup: ""
      factory_ref: ${{ github.event.repository.default_branch }}
